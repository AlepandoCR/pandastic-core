# Publishes the shaded library to this repository's GitHub Packages on every push to
# master. Uses the workflow's automatic GITHUB_TOKEN, which already has write:packages
# for this repo — no PAT or manual secret needed for CI. A PAT is only required for
# publishing from a developer machine (see the publishing block in build.gradle.kts)
# and for CONSUMING the package from other projects.
name: publish

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # build runs every test suite; publish only happens on a green tree.
      - name: Build and publish
        run: ./gradlew build publishShadowPublicationToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
